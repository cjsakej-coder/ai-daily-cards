<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI신상 진열대 · 툴 링크와 가격</title><style>
:root{--bg:#fff;--ink:#1d1b26;--muted:#6b6878;--line:#ece9f1;--accent:#ff3e7f;--chip:#f5f2f8}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}

.btn.dark{background:#0b1020}.lock{border:2px solid var(--accent)}
@media (prefers-color-scheme:dark){.btn.dark{background:#2b3d75}}.k{font-weight:800}.price{font-weight:800;color:var(--accent)}
footer{margin-top:40px;color:var(--muted);font-size:13px}

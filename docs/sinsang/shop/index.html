<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI신상 프롬프트 가게</title><meta property="og:title" content="AI신상 프롬프트 가게"><meta property="og:description" content="사진 한 장 + 복붙 한 줄 - 매주 새 프롬프트 입고"><style>:root{--bg:#fff5f8;--card:#fff;--ink:#2d233c;--muted:#7a6f86;--pink:#e94580;--soft:#ffe3ee;--code:#2d233c;--codeink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1c1622;--card:#2a2231;--ink:#f3ecf7;--muted:#b9adc4;--pink:#ff6f9f;--soft:#3a2b3e;--code:#120e16;--codeink:#f3ecf7}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}h1{font-size:26px;line-height:1.35;margin:8px 0 6px}h2{font-size:19px;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 18px}section{background:var(--card);border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 4px 14px rgba(233,69,128,.08)}
img{width:100%;border-radius:14px;display:block}.cap{font-size:13px;color:var(--muted);margin-top:8px}.row{display:grid;grid-template-columns:1fr 2fr;gap:10px;align-items:center}
ol,ul{padding-left:22px;margin:0}li{margin:6px 0}b{color:var(--pink)}a{color:var(--pink);font-weight:700}
pre{background:var(--code);color:var(--codeink);border-radius:14px;padding:14px;white-space:pre-wrap;word-break:keep-all;font-size:13.5px;max-height:320px;overflow:auto;margin:0}
button{display:block;width:100%;border:0;border-radius:14px;background:var(--pink);color:#fff;font-size:17px;font-weight:700;padding:14px;margin:12px 0 0;cursor:pointer}
.tag{display:inline-block;background:var(--soft);color:var(--pink);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700}.note{font-size:14px;color:var(--muted)}
footer{text-align:center;font-size:13px;color:var(--muted);margin-top:24px}.item{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;text-decoration:none;color:var(--ink)}
.item img{border-radius:12px}</style></head><body><main>

</main></body></html>
